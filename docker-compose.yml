services:
  api:
    build:
      context: ./backend
    container_name: audit-api
    restart: unless-stopped
    ports:
      # 宿主机端口可通过环境变量 API_HOST_PORT 配置
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); assert json.load(r).get('status')=='ok'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ./web
    container_name: audit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主机端口可通过环境变量 WEB_HOST_PORT 配置
      - "${WEB_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：docker compose up verify 完成后自行退出，
  # 退出码 0 = 全部通过，非 0 = 存在失败项。
  # 置于 verify profile，默认 up 不运行。
  verify:
    profiles: ["verify"]
    build:
      context: ./verify
    container_name: audit-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"
